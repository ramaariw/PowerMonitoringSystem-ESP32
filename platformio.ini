; PlatformIO Project Configuration File untuk PMS V1.3
; Optimize for: Stability & USB Upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Kecepatan upload kita maksimalin biar gak lumutan nungguin bar progress
upload_speed = 921600

lib_deps = 
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.2
